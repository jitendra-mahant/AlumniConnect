<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AlumniConnect is your college's trusted professional network. Discover verified alumni, get mentorship, referrals, jobs and internships."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('alumniconnect_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var font = localStorage.getItem('alumniconnect_font') || 'arial';
          var fontMap = {
            arial: 'Arial, Helvetica, sans-serif',
            helvetica: 'Helvetica, Arial, sans-serif',
            times: "'Times New Roman', Times, serif",
          };
          var chosenFont = fontMap[font] || fontMap.arial;
          document.documentElement.style.setProperty('--app-font-family', chosenFont);
          document.documentElement.style.setProperty('--app-font', chosenFont);
          document.documentElement.style.setProperty('--heading-font', chosenFont);
          document.documentElement.setAttribute('data-font', font);
        } catch (e) {}
      })();
    </script>
    <title>AlumniConnect – Your College's Trusted Alumni Network</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
